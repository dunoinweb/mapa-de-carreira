<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>David Silva | Comunicação, Marketing e Conteúdo</title>

  <style>
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e5e7eb;
  }

  .container {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .section {
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    transition: transform 0.2s ease;
  }

  .section:hover {
    transform: translateY(-5px);
  }

  h1, h2, h3 {
    margin-top: 0;
  }

  h2 {
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 8px;
  }

  .profile-header {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .profile-img {
    width: 110px;
    height: 110px;
    border-radius: 16px;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.2);
  }

  .headline {
    color: #9ca3af;
  }

  .contacts a {
    display: inline-block;
    margin-right: 10px;
    margin-top: 6px;
    text-decoration: none;
    color: #60a5fa;
    font-size: 14px;
    transition: 0.2s;
  }

  .contacts a:hover {
    color: #93c5fd;
  }

  .career-item {
    margin-bottom: 20px;
    padding: 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
  }

  .career-item h3 {
    color: #60a5fa;
  }

  .bar {
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 999px;
    margin-top: 4px;
  }

  .fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #3b82f6, #06b6d4);
  }

  ul {
    padding-left: 18px;
  }

  li {
    margin-bottom: 4px;
  }

  /* PROJETOS */
  #projects div {
    background: rgba(255,255,255,0.03);
    padding: 12px;
    border-radius: 10px;
    margin-top: 10px;
  }

  #projects h3 {
    margin-bottom: 5px;
    color: #34d399;
  }

    .section p {
  line-height: 1.5;
}

    
/* ANIMAÇÃO SCROLL */
.hidden {
  opacity: 0;
  transform: translateY(30px);
  transition: all 0.6s ease;
}

.show {
  opacity: 1;
  transform: translateY(0);
}

.career-img {
  width: 100%;
  max-height: 250px;
  object-fit: cover;
  border-radius: 10px;
  margin: 10px 0;
}

</style>

</head>

<body>

<div class="container">

  <!-- PERFIL -->
  <div class="section">
    <div class="profile-header">
      <img id="profile-photo" class="profile-img">
      
      <div>
        <h1 id="name" style="font-size:28px;"></h1>
        <p id="headline" class="headline"></p>

        <div id="contact-list" class="contacts"></div>
      </div>
    </div>

    <p id="summary" style="margin-top:16px;"></p>
  </div>

  <!-- CARREIRA -->
  <div class="section">
    <h2>Mapa de carreira</h2>
    <div id="career"></div>
  </div>
  
<!-- PROJETOS -->
<div class="section">
  <h2>Projetos</h2>
  <div id="projects"></div>
</div>
  
  <!-- HABILIDADES -->
  <div class="section">
    <h2>Habilidades</h2>
    <div id="skills"></div>

    <h3>Outras competências</h3>
    <ul id="other-skills"></ul>
  </div>

  <!-- IDIOMAS -->
  <div class="section">
    <h2>Idiomas</h2>
    <ul id="languages"></ul>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
``
