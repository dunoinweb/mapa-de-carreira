<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>David Silva | Mapa de Carreira</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f4f6f8;
      color: #1f2933;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    h1, h2, h3 {
      margin-top: 0;
      color: #111827;
    }

    h1 {
      font-size: 28px;
    }

    h2 {
      font-size: 20px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    h3 {
      font-size: 16px;
      margin-top: 20px;
    }

    p {
      line-height: 1.5;
      color: #374151;
    }

    ul {
      margin: 8px 0 16px;
      padding-left: 20px;
    }

    li {
      margin-bottom: 5px;
    }

    .profile-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 10px;
      object-fit: cover;
    }

    .headline {
      color: #4b5563;
      margin-top: 4px;
    }

    .contacts a {
      display: block;
      color: #2563eb;
      text-decoration: none;
      margin-top: 4px;
    }

    .contacts a:hover {
      text-decoration: underline;
    }

    .skill {
      margin-bottom: 10px;
    }

    .skill span {
      font-size: 14px;
    }

    .bar {
      height: 6px;
      background: #e5e7eb;
      border-radius: 999px;
      margin-top: 4px;
    }

    .fill {
      height: 100%;
      background: #111827;
      border-radius: 999px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- PERFIL -->
  <div class="section">
    <div class="profile-header">
      <img id="profile-photo" class="profile-img">
      
      <div>
        <h1 id="name"></h1>
        <p id="headline" class="headline"></p>

        <div id="contact-list" class="contacts"></div>
      </div>
    </div>

    <p id="summary" style="margin-top:16px;"></p>
  </div>

  <!-- MAPA DE CARREIRA -->
  <div class="section">
    <h2>Mapa de carreira</h2>
    <div id="career"></div>
  </div>

  <!-- HABILIDADES -->
  <div class="section">
    <h2>Habilidades</h2>
    <div id="skills"></div>

    <h3>Outras competências</h3>
    <ul id="other-skills"></ul>
  </div>

  <!-- IDIOMAS -->
  <div class="section">
    <h2>Idiomas</h2>
    <ul id="languages"></ul>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
``
