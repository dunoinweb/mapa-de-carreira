<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mapa de Carreira</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    h2 {
      margin-top: 0;
    }

    ul {
      padding-left: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="box">
    <h2 id="name"></h2>
    <p id="headline"></p>
    <p id="summary"></p>
  </div>

  <div class="box">
    <h2>Mapa de Carreira</h2>
    <div id="career"></div>
  </div>

  <div class="box">
    <h2>Habilidades</h2>
    <div id="skills"></div>
  </div>

  <div class="box">
    <h2>Idiomas</h2>
    <ul id="languages"></ul>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
