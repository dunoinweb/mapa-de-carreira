<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Silva | Mapa de Carreira</title>

  <link href="assets/css/bootstrap-6.css" rel="stylesheet">

  <style>
    body {
      background-color: #f5f6fa;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin-top: 40px;
    }

    .card {
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
    }

    .badge {
      margin: 3px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- PERFIL -->
  <div class="card p-4 text-center shadow-sm">
    <img id="profile-photo" class="profile-img mx-auto">
    <h2 id="profile-name" class="mt-3"></h2>
    <p id="profile-headline" class="text-muted"></p>

    <p id="profile-summary" class="mt-3"></p>

    <a id="cv-link" class="btn btn-primary mt-2">Baixar currículo</a>

    <ul id="contact-list" class="list-unstyled mt-3"></ul>
  </div>

  <!-- CARREIRA -->
  <div class="card p-4 shadow-sm">
    <h3 class="mb-3">🚀 Mapa de Carreira</h3>
    <div id="career-timeline"></div>
  </div>

  <!-- SKILLS -->
  <div class="card p-4 shadow-sm">
    <h3 class="mb-3">🛠️ Habilidades</h3>
    <div id="skill-groups"></div>

    <h5 class="mt-4">Outras competências</h5>
    <ul id="other-skills" class="list-inline"></ul>
  </div>

  <!-- IDIOMAS -->
  <div class="card p-4 shadow-sm">
    <h3 class="mb-3">🌎 Idiomas</h3>
    <ul id="language-list"></ul>
  </div>

</div>

<script src="assets/js/carreira-json.js"></script>

</body>
</html>
